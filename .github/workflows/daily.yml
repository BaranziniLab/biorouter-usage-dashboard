name: Daily collection

# Reads every Biorouter release download count once a day, commits the history
# under data/, and publishes the dashboard to GitHub Pages. A push that changes
# the site or the collector republishes from the stored history without
# collecting.

on:
  schedule:
    - cron: '23 1 * * *' # 01:23 UTC; keep in step with SCHEDULE_UTC in scripts/collect.mjs
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/daily.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect download counts
        if: github.event_name != 'push'
        env:
          # Release counts are public, so the workflow token is enough. Repository
          # traffic needs a token that can read BaranziniLab/biorouter's traffic;
          # add it as the TRAFFIC_TOKEN secret to keep that history growing.
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
        run: node scripts/collect.mjs

      - name: Rebuild the site data from the stored history
        if: github.event_name == 'push'
        run: node scripts/collect.mjs --build

      - name: Commit the new history
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Daily collection $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
