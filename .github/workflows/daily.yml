name: Daily collection

# Reads every Biorouter release download count once a day, commits the history
# under data/, and publishes the dashboard to GitHub Pages. A push that changes
# the site or the collector republishes from the stored history without
# collecting.
#
# Before replacing release files (gh release upload --clobber), read their
# counts and pass them to a manual run, so the downloads they gained since the
# last collection are kept:
#   gh api repos/BaranziniLab/biorouter-skills/releases --paginate \
#     --jq '.[] | .tag_name as $t | .assets[] | [$t, .id, .name, .download_count] | @tsv' > counts.tsv
#   gh workflow run daily.yml -R BaranziniLab/biorouter-usage-dashboard -f snapshot="$(cat counts.tsv)"

on:
  schedule:
    - cron: '23 1 * * *' # 01:23 UTC; keep in step with SCHEDULE_UTC in scripts/collect.mjs
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Optional release file counts to fold in first: tag, asset id, name, count[, ISO time], tab separated, one file per line'
        required: false
        default: ''
      snapshot_repo:
        description: 'Repository the snapshot lists'
        required: false
        default: 'BaranziniLab/biorouter-skills'
      snapshot_at:
        description: 'When the snapshot was read (ISO time); the run time if empty'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/daily.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true # the commit step pushes with the workflow token

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No network and no packages: the history rules are checked against
      # fixtures and against a copy of data/ before anything is committed.
      - name: Test the collector
        run: npm test

      - name: Collect download counts
        if: github.event_name != 'push'
        env:
          # Release counts are public, so the workflow token is enough. Repository
          # traffic needs a token that can read BaranziniLab/biorouter's traffic;
          # add it as the TRAFFIC_TOKEN secret to keep that history growing.
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
          # Empty on the schedule. Read from the environment, never pasted into
          # the shell, so a snapshot's text cannot run as a command.
          SNAPSHOT_TSV: ${{ inputs.snapshot }}
          SNAPSHOT_REPO: ${{ inputs.snapshot_repo }}
          SNAPSHOT_AT: ${{ inputs.snapshot_at }}
        run: node scripts/collect.mjs

      - name: Rebuild the site data from the stored history
        if: github.event_name == 'push'
        run: node scripts/collect.mjs --build

      - name: Commit the new history
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Daily collection $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
